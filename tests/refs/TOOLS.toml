# The reference tools and libraries examples/record_refs may run, each with the
# call that prints its version and the version line it printed on the recording
# machine. The recorder checks the line before an area runs and refuses the area
# when this machine prints another; it writes the pinned line into each manifest.
#
# version: the command, split on spaces; find: the first output line holding it
# (stdout, then stderr; empty takes the first line); upto: the line is cut before
# it. library: the shared library; call: its version function; returns: "string"
# (const char *) or "int" (0xMMmmpp). A library's line is its resolved file name,
# a space, and what the call returned.

[x264]
version = "x264 --version"
find = "x264 "
line = "x264 0.165.3222 b35605a"

[x265]
version = "x265 --version"
find = "HEVC encoder version"
line = "x265 [info]: HEVC encoder version 4.3"

[vpxenc]
version = "vpxenc --help"
find = "VP9 Encoder"
line = "vp9    - WebM Project VP9 Encoder v1.17.0 (default)"

[vpxdec]
version = "vpxdec --help"
find = "VP9 Decoder"
line = "vp9    - WebM Project VP9 Decoder v1.17.0"

[aomenc]
version = "aomenc --help"
find = "AV1 Encoder"
line = "av1    - AOMedia Project AV1 Encoder v3.15.2 (default)"

[SvtAv1EncApp]
version = "SvtAv1EncApp --version"
find = "SVT-AV1"
line = "SVT-AV1 v4.2.0 (debug)"

[rav1e]
version = "rav1e --version"
find = "rav1e "
line = "rav1e 0.8.1 (UNKNOWN) (release)"

[dav1d]
version = "dav1d --version"
line = "1.5.4"

[aomdec]
version = "aomdec --help"
find = "AV1 Decoder"
line = "av1    - AOMedia Project AV1 Decoder v3.15.2"

[flac]
version = "flac --version"
line = "flac 1.5.0"

[lame]
version = "lame --version"
find = "LAME"
line = "LAME 64bits version 4.0 (https://lame.sourceforge.io)"

[mpg123]
version = "mpg123 --version"
line = "mpg123 1.33.7"

[faac]
version = "faac --version"
find = "FAAC 2"
line = "FAAC 2.1.0"

[faad]
version = "faad -h"
find = "AAC Decoder"
line = "*********** Ahead Software MPEG-4 AAC Decoder V2.11.4 ******************"

[a52dec]
version = "a52dec -h"
find = "a52dec-"
upto = " - "
line = "a52dec-0.8.0"

[cjpeg]
version = "cjpeg -version"
find = "libjpeg-turbo"
line = "libjpeg-turbo version 3.2.0 (build 20260701)"

[djpeg]
version = "djpeg -version"
find = "libjpeg-turbo"
line = "libjpeg-turbo version 3.2.0 (build 20260701)"

[jpegtran]
version = "jpegtran -version"
find = "libjpeg-turbo"
line = "libjpeg-turbo version 3.2.0 (build 20260701)"

[magick]
version = "magick --version"
find = "ImageMagick"
line = "Version: ImageMagick 7.1.2-34 Q16-HDRI x86_64 c5d4ca8a0:20261014 https://imagemagick.org"

[libopus]
library = "/usr/lib/libopus.so.0"
call = "opus_get_version_string"
line = "libopus.so.0.11.1 libopus 1.6.1"

[libvorbisenc]
library = "/usr/lib/libvorbisenc.so.2"
call = "vorbis_version_string"
line = "libvorbisenc.so.2.0.12 Xiph.Org libVorbis 1.3.7"

[libvorbisfile]
library = "/usr/lib/libvorbisfile.so.3"
call = "vorbis_version_string"
line = "libvorbisfile.so.3.3.8 Xiph.Org libVorbis 1.3.7"

[libwebp]
library = "/usr/lib/libwebp.so.7"
call = "WebPGetEncoderVersion"
returns = "int"
line = "libwebp.so.7.2.0 1.6.0"
