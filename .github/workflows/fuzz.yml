name: Fuzz

on:
  push:
    branches: [main, "task/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [mp4, mkv, probe, h264, hevc, vp9_ivf, aac_adts, opus, pcm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: fuzz
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: fuzz/seeds "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Fuzz ${{ matrix.target }}
        run: |
          case "$EVENT" in
            schedule) seconds=1200 ;;
            *) seconds=60 ;;
          esac
          case "$TARGET" in
            aac_adts|opus|pcm) max_len=65536 ;;
            *) max_len=262144 ;;
          esac
          cargo fuzz run "$TARGET" -- \
            -max_total_time="$seconds" \
            -timeout=30 \
            -rss_limit_mb=3072 \
            -max_len="$max_len" \
            -print_final_stats=1
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-${{ matrix.target }}-crashes
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
