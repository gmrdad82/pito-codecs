name: CI

on:
  push:
    branches: [main, "task/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: debian:forky@sha256:716a7ceeaf1557c357a3c484839176dab750fbda0c5d0530dbbb18f94ccf826b
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu, aarch64-apple-darwin, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-unknown-linux-gnu -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            container: debian:forky@sha256:716a7ceeaf1557c357a3c484839176dab750fbda0c5d0530dbbb18f94ccf826b
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: debian:forky@sha256:716a7ceeaf1557c357a3c484839176dab750fbda0c5d0530dbbb18f94ccf826b
          - name: windows-x64
            os: windows-2025
            container: ""
          - name: macos-arm64
            os: macos-15
            container: ""
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config ffmpeg libwebp-dev
      - if: runner.os == 'Windows'
        run: command -v ffmpeg || choco install ffmpeg -y --no-progress
      - if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: release-${{ matrix.name }}
      - uses: taiki-e/install-action@b1351b86cd80d01fa50a500e2c3e435ce4e1dd60
        with:
          tool: nextest
      - run: ffmpeg -hide_banner -version | head -1
      - run: cargo nextest run --release --all-targets --no-fail-fast
      - run: cargo test --release --doc
      - run: cargo build --release
      - run: bin/smoke
