name: CI

on:
  push:
    branches: [main, "task/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: debian:forky@sha256:716a7ceeaf1557c357a3c484839176dab750fbda0c5d0530dbbb18f94ccf826b
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo clippy --lib --no-default-features --features gpu,filter --target aarch64-apple-darwin -- -D warnings

  test:
    runs-on: ubuntu-24.04
    container:
      image: debian:forky@sha256:716a7ceeaf1557c357a3c484839176dab750fbda0c5d0530dbbb18f94ccf826b
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config ffmpeg libwebp-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: release
      - uses: taiki-e/install-action@b1351b86cd80d01fa50a500e2c3e435ce4e1dd60
        with:
          tool: nextest
      - run: ffmpeg -hide_banner -version | head -1
      - run: cargo nextest run --release --all-targets --no-fail-fast
      - run: cargo test --release --doc
      - run: cargo build --release
