[package]
name = "pito-codecs"
description = "Video and audio codecs, containers and GPU routes in Rust for PITO MD apps"
version = "3.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-codecs"

[features]
default = ["media", "audio", "h264", "hevc", "aac", "ac3", "mp4", "gpu", "filter", "opus", "vp9", "webp", "mkv", "gif", "mp3", "flac", "png", "jpeg", "cli", "av1", "alac", "vorbis"]
media = []
h264 = ["media", "dep:rayon"]
hevc = ["media", "dep:rayon"]
aac = ["media"]
audio = ["media", "aac", "mkv", "mp4", "alac", "flac", "vorbis", "dep:rayon"]
ac3 = ["media"]
mp3 = ["media"]
flac = ["media"]
alac = ["media"]
vorbis = ["media"]
mp4 = ["media"]
gpu = [
    "media",
    "dep:rayon",
    "dep:libloading",
    "dep:windows",
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
]
filter = ["media", "dep:rayon"]
mkv = ["media", "mp4"]
opus = ["media", "dep:rayon"]
vp9 = ["media", "dep:rayon"]
av1 = ["media"]
webp = ["media", "filter", "dep:rayon"]
gif = ["filter", "dep:rayon"]
png = ["media"]
jpeg = ["media"]
cli = ["media", "h264", "hevc", "aac", "ac3", "mp4", "gpu", "filter", "mkv", "vp9", "png", "jpeg", "opus", "gif", "webp", "alac", "flac", "vorbis", "dep:clap"]

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
libloading = { version = "0.8", optional = true }

[dependencies]
rayon = { version = "1.10", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true }
objc2-video-toolbox = { version = "0.3.2", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.ci]
inherits = "release"
lto = false
strip = false

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "media_speed"
required-features = ["media", "h264", "hevc", "aac", "mp4", "gpu", "filter", "mkv", "vp9"]

[[example]]
name = "mp3"
required-features = ["media", "h264", "hevc", "aac", "mp4", "gpu", "filter", "mkv", "vp9", "mp3"]

[[example]]
name = "flac"
required-features = ["audio", "flac"]

[[example]]
name = "alac"
required-features = ["media", "audio", "alac", "mp4", "mkv"]

[[example]]
name = "readme_shots"
required-features = ["media", "h264", "hevc", "aac", "mp4", "gpu", "filter", "mkv", "vp9", "gif", "webp"]

[[example]]
name = "record_refs"
required-features = ["cli", "av1", "mp3"]

[[example]]
name = "bench"
test = true
required-features = ["media", "h264", "hevc", "aac", "mp4", "gpu", "filter", "mkv", "vp9"]

[[bin]]
name = "pcod"
path = "src/bin/pcod.rs"
required-features = ["cli"]

[dev-dependencies]
libloading = "0.8"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
