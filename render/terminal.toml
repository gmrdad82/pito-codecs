app = "pcodec"
bin = "pcodec"
grid = [72, 20]
frame = "window"
prompt = "$ "
typing = "30ms"
setup = "sh {app}/render/terminal/clip.sh {scratch}/demo"

[build]
command = "cargo build --release --locked --example pcodec"
bin_dir = "{target}/release/examples"

[env]
HOME = "home"
TMPDIR = "temp"
NO_COLOR = "1"

[theme]
name = "Catppuccin Mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
selection = "#45475a"
cursor = "#f5e0dc"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
brightBlack = "#585b70"
brightRed = "#f38ba8"
brightGreen = "#a6e3a1"
brightYellow = "#f9e2af"
brightBlue = "#89b4fa"
brightMagenta = "#f5c2e7"
brightCyan = "#94e2d5"
brightWhite = "#a6adc8"

[shots.decode]
kind = "clip"
line = "pcodec probes a 1080p clip, decodes it on the CPU and on the GPU, then encodes HEVC on the GPU"
tape = "render/terminal/decode.tape"
launch = "cd {scratch}/demo && export PATH={bin}:$PATH && clear"
settle = "400ms"
status = "SHIPPED"
